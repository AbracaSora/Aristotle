name: Backend checks
on:
  push:
    paths: ['code/backend/**', 'code/core_engine/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'uv.lock', 'compose.yaml', 'tools/quality/**', 'quality/**', 'AGENTS.md', '.pre-commit-config.yaml', '.github/workflows/backend.yml']
  pull_request:
    paths: ['code/backend/**', 'code/core_engine/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'uv.lock', 'compose.yaml', 'tools/quality/**', 'quality/**', 'AGENTS.md', '.pre-commit-config.yaml', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aristotle
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: aristotle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aristotle -d aristotle_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check code/backend code/core_engine tests scripts
      - run: uv run ruff format --check code/backend code/core_engine tests scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools/quality --ignore-scripts --no-audit --no-fund
      - run: uv run python scripts/check_guardrails.py --full --output .local/quality-ci
        env:
          ARISTOTLE_REVIEW_BASE: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD^' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-quality-reports
          path: .local/quality-ci
      - run: uv run pytest -q tests/integration
        if: always()
        env:
          ARISTOTLE_TEST_DATABASE_URL: postgresql+psycopg://aristotle:ci-only@127.0.0.1:5432/aristotle_test
