[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aristotle-backend"
version = "0.1.0"
description = "Aristotle 408 backend API prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "python-dotenv>=1,<2",
    "httpx>=0.28,<1",
    "pypdf>=6,<7",
    "python-multipart>=0.0.22,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "pylint>=4.0.9,<5",
    "radon>=6,<7",
    "bandit>=1.8,<2",
    "pytest-cov>=6,<8",
    "pip-audit>=2.7,<3",
    "mypy>=1.15,<2",
    "cognitive-complexity>=1.3,<2",
    "pre-commit>=4,<5",
    "detect-secrets>=1.5,<2",
    "diff-cover>=9,<11",
    "httpx2>=2,<3",
]

[tool.setuptools]
packages = ["aristotle_backend", "aristotle_core"]

[tool.setuptools.package-dir]
aristotle_backend = "code/backend/aristotle_backend"
aristotle_core = "code/core_engine/aristotle_core"

[tool.setuptools.package-data]
aristotle_backend = ["static/*.html", "migration_scripts/*.py", "migration_scripts/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
