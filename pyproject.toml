[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aristotle-backend"
version = "0.1.0"
description = "Aristotle 408 backend API prototype"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools]
packages = ["aristotle_backend", "aristotle_core"]

[tool.setuptools.package-dir]
aristotle_backend = "code/backend/aristotle_backend"
aristotle_core = "code/core_engine/aristotle_core"

[tool.setuptools.package-data]
aristotle_backend = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
