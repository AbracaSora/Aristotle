<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>考研 408 · 知识地图</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eaf5ee;
      --muted: #91ad9e;
      --panel: rgba(13, 29, 27, .88);
      --panel-2: rgba(24, 48, 43, .82);
      --line: rgba(177, 220, 184, .18);
      --gold: #f6c967;
      --mint: #9fe2bc;
      --danger: #ff9b8f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #081917;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      height: 100vh;
    }

    aside {
      position: relative;
      z-index: 2;
      padding: 28px 22px;
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(12, 30, 28, .98), rgba(8, 22, 23, .94));
      overflow: auto;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 27px;
      letter-spacing: -.02em;
      font-weight: 600;
    }

    .intro {
      margin: 10px 0 24px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    label,
    .label {
      display: block;
      margin: 17px 0 7px;
      color: #c0d8c4;
      font-size: 12px;
    }

    textarea,
    input[type="number"],
    input[type="text"] {
      width: 100%;
      border: 1px solid rgba(190, 230, 195, .2);
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: rgba(0, 12, 14, .46);
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    textarea {
      min-height: 250px;
      padding: 12px;
      resize: vertical;
    }

    input[type="number"],
    input[type="text"] {
      padding: 10px 11px;
    }

    textarea:focus,
    input:focus {
      border-color: rgba(159, 226, 188, .7);
      box-shadow: 0 0 0 3px rgba(159, 226, 188, .08);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .range-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--mint);
    }

    .range-value {
      min-width: 34px;
      color: var(--mint);
      font: 12px ui-monospace, monospace;
      text-align: right;
    }

    .cell-count-wrap {
      display: grid;
      grid-template-columns: 1fr 78px;
      align-items: center;
      gap: 10px;
    }

    .cell-count-wrap input[type="number"] {
      width: 78px;
      padding: 6px 8px;
    }

    .actions {
      display: flex;
      gap: 9px;
      margin-top: 18px;
    }

    button {
      border: 1px solid rgba(190, 230, 195, .22);
      border-radius: 9px;
      padding: 10px 13px;
      color: var(--ink);
      background: rgba(117, 180, 145, .1);
      cursor: pointer;
      font: 600 12px inherit;
      transition: .2s ease;
    }

    button:hover,
    button:focus-visible {
      border-color: rgba(246, 201, 103, .75);
      background: rgba(246, 201, 103, .13);
      outline: none;
    }

    button.primary {
      color: #14251e;
      border-color: transparent;
      background: linear-gradient(135deg, #f6cf79, #a9e4bc);
    }

    .status {
      min-height: 20px;
      margin: 12px 0 0;
      color: var(--danger);
      font-size: 12px;
      line-height: 1.5;
    }

    .status.ok {
      color: var(--muted);
    }

    .info {
      margin-top: 19px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .info h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .stat {
      padding: 10px 8px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255, 255, 255, .025);
    }

    .stat b {
      display: block;
      color: var(--gold);
      font: 18px Georgia, serif;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
    }

    .selected {
      margin-top: 13px;
      padding: 12px;
      min-height: 86px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(246, 201, 103, .12), rgba(159, 226, 188, .08));
    }

    .selected strong {
      display: block;
      margin-bottom: 5px;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 16px;
    }

    .selected p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .node-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 13px;
    }

    .node-list button {
      padding: 8px 9px;
      overflow: hidden;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 500;
    }

    .node-list button.active {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(246, 201, 103, .1);
    }

    .hint {
      margin: 18px 0 0;
      color: #668477;
      font-size: 11px;
      line-height: 1.6;
    }

    main {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: #102925;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .map-title {
      position: absolute;
      top: 24px;
      left: 28px;
      pointer-events: none;
      text-shadow: 0 2px 15px #05110f;
    }

    .map-title span {
      display: block;
      color: #b8d7c1;
      font: 11px ui-monospace, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .85;
    }

    .map-title h2 {
      margin: 4px 0 0;
      color: #f0dfad;
      font: 28px Georgia, serif;
      font-weight: 500;
    }

    .map-tip {
      position: absolute;
      right: 25px;
      bottom: 20px;
      padding: 9px 12px;
      border: 1px solid rgba(207, 232, 198, .18);
      border-radius: 8px;
      color: #bdd3c0;
      background: rgba(4, 17, 17, .54);
      font-size: 11px;
      backdrop-filter: blur(8px);
    }

    @media (max-width: 850px) {
      body {
        overflow: auto;
      }

      .app {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100vh;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      main {
        height: 70vh;
        min-height: 520px;
      }
    }

    body.embedded { overflow: hidden; background: transparent; }
    body.embedded .app { display: block; height: 100vh; min-height: 0; }
    body.embedded aside, body.embedded .map-title, body.embedded .map-tip { display: none; }
    body.embedded main { height: 100vh; min-height: 0; padding: 0; }
    body.embedded #map { width: 100%; height: 100%; display: block; }
  </style>
</head>

<body>
  <div class="app">
    <aside>
      <p class="eyebrow">考研 408 · 数据结构</p>
      <h1>知识地图</h1>
      <p class="intro">从左向右阅读学习路径。选择一个知识点，查看学习目标和关联路线。</p>

      <label for="graphInput">知识点与先修关系（JSON）</label>
      <textarea id="graphInput" spellcheck="false"></textarea>
      <div class="row">
        <div>
          <label for="seed">布局种子</label>
          <input id="seed" type="text" value="qingyun-42" />
        </div>
        <div>
          <label for="detail">地形细节</label>
          <div class="range-wrap"><input id="detail" type="range" min="1" max="5" value="3" /><span class="range-value"
              id="detailValue">3</span></div>
        </div>
      </div>
      <label for="cellCount">底图细分数量</label>
      <div class="cell-count-wrap">
        <input id="cellCountRange" type="range" min="300" max="22000" step="100" value="1160" />
        <input id="cellCount" type="number" min="100" max="22000" step="100" value="1160" inputmode="numeric" />
      </div>
      <div class="actions"><button class="primary" id="generate">生成地图</button><button id="example">载入数据结构示例</button></div>
      <div id="status" class="status" role="alert"></div>

      <section class="info" aria-live="polite">
        <h2>地图概览</h2>
        <div class="stats">
          <div class="stat"><b id="nodeCount">—</b><span>知识点</span></div>
          <div class="stat"><b id="edgeCount">—</b><span>先修关系</span></div>
          <div class="stat"><b id="layerCount">—</b><span>学习层级</span></div>
        </div>
        <div class="selected" id="selected"><strong>选择知识点</strong>
          <p>查看学习目标与关联知识点。</p>
        </div>
        <div class="node-list" id="nodeList"></div>
        <p class="hint">操作：拖拽移动地图 · 滚轮缩放 · 点击知识点查看关联 · 双击画布回到全图</p>
      </section>
    </aside>
    <main>
      <div class="map-title"><span>学习路径</span>
        <h2>知识点与先修关系</h2>
      </div>
      <canvas id="map" role="img" aria-label="知识点及其先修关系图"></canvas>
      <div class="map-tip">蓝线 · 前置知识　金线 · 后续知识</div>
    </main>
  </div>

      const input = document.getElementById('graphInput');

      const state = { graph: null, layout: null, terrain: null, selected: null, hover: null, zoom: 1, panX: 0, panY: 0, dragging: false, moved: false, lastX: 0, lastY: 0, dpr: 1, width: 0, height: 0 };

      }
      function fract(v) { return v - Math.floor(v); }

          const a = polygon[i], b = polygon[j];

        }
        return inside;
      }
      function clipCell(poly, nx, ny, mx, my) {
        const out = []; const inside = p => (p.x - mx) * nx + (p.y - my) * ny <= 0;
        for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length], ia = inside(a), ib = inside(b); if (ia) out.push(a); if (ia !== ib) { const da = (a.x - mx) * nx + (a.y - my) * ny, db = (b.x - mx) * nx + (b.y - my) * ny, t = da / (da - db); out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }); } }

      }
      function buildDelaunayMesh(sites, width, height) {

        const points = superSites.concat(sites); const circumcircle = tri => { const a = points[tri[0]], b = points[tri[1]], c = points[tri[2]], d = 2 * (a.x * (b.y - c.y) + b.x * (c.y - a.y) + c.x * (a.y - b.y)); if (Math.abs(d) < 1e-9) return { x: 0, y: 0, r2: -1 }; const ax = a.x * a.x + a.y * a.y, bx = b.x * b.x + b.y * b.y, cx = c.x * c.x + c.y * c.y, x = (ax * (b.y - c.y) + bx * (c.y - a.y) + cx * (a.y - b.y)) / d, y = (ax * (c.x - b.x) + bx * (a.x - c.x) + cx * (b.x - a.x)) / d; return { x, y, r2: (x - a.x) ** 2 + (y - a.y) ** 2 }; };

        triangles = triangles.filter(tri => tri.every(index => index >= 3)); const neighbors = sites.map(() => new Set()); const centers = triangles.map(circumcircle); triangles.forEach(tri => { for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) { const a = tri[i] - 3, b = tri[j] - 3; neighbors[a].add(b); neighbors[b].add(a); } }); const polygons = sites.map(() => []); triangles.forEach((tri, i) => tri.forEach(index => polygons[index - 3].push(centers[i]))); const cells = sites.map((site, i) => { const poly = polygons[i].sort((a, b) => Math.atan2(a.y - site.y, a.x - site.x) - Math.atan2(b.y - site.y, b.x - site.x)).map(p => ({ x: clamp(p.x, 0, width), y: clamp(p.y, 0, height) })); return { site, poly: poly.length > 2 ? poly : [{ x: site.x - 2, y: site.y - 2 }, { x: site.x + 2, y: site.y - 2 }, { x: site.x + 2, y: site.y + 2 }, { x: site.x - 2, y: site.y + 2 }] }; }); return { cells, neighbors };
      }
      function buildAdjacency(sites, width, height, useGridCells, gridCols, gridRows) {
        const neighbors = sites.map(() => new Set());
        if (useGridCells) {

      function parseGraph(raw) {
        const data = JSON.parse(raw);

        const ids = new Set();
        const nodes = data.nodes.map((n, i) => { if (!n || !n.id || ids.has(n.id)) throw new Error('节点 id 必须存在且唯一（第 ' + (i + 1) + ' 个节点有问题）。'); ids.add(n.id); const type = String(n.type || '知识点'); const fallbackDifficulty = type === '终点' ? 5 : type === '主峰' ? 4 : type === '关隘' ? 3 : 2; return { id: String(n.id), label: String(n.label || n.id), type, difficulty: clamp(Number(n.difficulty) || fallbackDifficulty, 1, 5), description: String(n.description || '暂未填写学习目标。') }; });
        const edges = data.edges.map((e, i) => { if (!Array.isArray(e) || e.length !== 2 || !ids.has(e[0]) || !ids.has(e[1]) || e[0] === e[1]) throw new Error('第 ' + (i + 1) + ' 条边无效。'); return [String(e[0]), String(e[1])]; });

        const q = nodes.filter(n => indegree.get(n.id) === 0).map(n => n.id); let seen = 0;
        while (q.length) { const id = q.shift(); seen++; out.get(id).forEach(next => { indegree.set(next, indegree.get(next) - 1); if (indegree.get(next) === 0) q.push(next); }); }

        const incoming = new Map(nodes.map(n => [n.id, []]));
        edges.forEach(([a, b]) => incoming.get(b).push(a));
        return { nodes, edges, out, incoming };
      }
      function layoutGraph(graph, width, height, seed, terrain) {
        const incoming = new Map(graph.nodes.map(n => [n.id, []]));
        graph.edges.forEach(([a, b]) => incoming.get(b).push(a));
        const rank = new Map();
